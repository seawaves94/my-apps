<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Apps</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      color: #111;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 30px 15px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .app {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .app-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .icon {
      font-size: 38px;
    }

    .app-name {
      font-size: 19px;
      font-weight: bold;
    }

    .play-button {
      display: block;
      margin-top: 18px;
      padding: 15px;
      background: #111;
      color: white;
      text-align: center;
      text-decoration: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>📱 My Apps</h1>

  <!-- Livres Classiques Français -->
  <div class="app">
    <div class="app-info">
      <div class="icon">📚</div>
      <div class="app-name">Livres Classiques Français</div>
    </div>

    <a class="play-button"
       href="intent://details?id=com.tourisminturkey.livres#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url=https%3A%2F%2Fplay.google.com%2Fstore%2Fapps%2Fdetails%3Fid%3Dcom.tourisminturkey.livres;end">
       ▶ Google Play
    </a>
  </div>


  <!-- Age Calculator -->
  <div class="app">
    <div class="app-info">
      <div class="icon">🎂</div>
      <div class="app-name">Age Calculator</div>
    </div>

    <a class="play-button"
       href="intent://details?id=com.tourisminturkey.agedatecalculator#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url=https%3A%2F%2Fplay.google.com%2Fstore%2Fapps%2Fdetails%3Fid%3Dcom.tourisminturkey.agedatecalculator;end">
       ▶ Google Play
    </a>
  </div>


  <!-- Winter Wallpaper -->
  <div class="app">
    <div class="app-info">
      <div class="icon">❄️</div>
      <div class="app-name">Winter Wallpaper</div>
    </div>

    <a class="play-button"
       href="intent://details?id=com.tourisminturkey.holidayschristmaswallpaper#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url=https%3A%2F%2Fplay.google.com%2Fstore%2Fapps%2Fdetails%3Fid%3Dcom.tourisminturkey.holidayschristmaswallpaper;end">
       ▶ Google Play
    </a>
  </div>

</div>

</body>
</html>
