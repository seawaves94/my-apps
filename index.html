<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>My Apps</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f6f7fb;color:#171717}
.wrap{max-width:760px;margin:auto;padding:28px 16px 44px}
.hero{text-align:center;margin-bottom:22px}
.hero .logo{font-size:44px;margin-bottom:6px}
.hero h1{margin:0;font-size:28px}
.apps{display:grid;gap:16px}
.card{background:#fff;border:1px solid #e7e7e7;border-radius:20px;padding:18px;box-shadow:0 4px 18px rgba(0,0,0,.05)}
.row{display:flex;gap:14px;align-items:center}
.icon{width:58px;height:58px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:30px;background:#f1f3f5;flex:0 0 auto}
h2{font-size:19px;margin:0;line-height:1.25}
.play{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:15px;padding:13px 16px;border-radius:14px;background:#111;color:#fff;text-decoration:none;font-weight:700;font-size:16px}
.triangle{width:0;height:0;border-top:10px solid transparent;border-bottom:10px solid transparent;border-left:17px solid #fff}
.footer{text-align:center;color:#888;font-size:13px;margin-top:20px}
</style>
</head>
<body>
<main class="wrap">
  <section class="hero">
    <div class="logo">📱</div>
    <h1>My Apps</h1>
  </section>
  <section class="apps">
    <article class="card">
      <div class="row"><div class="icon">📚</div><h2>Livres Classiques Français</h2></div>
      <a class="play" href="https://play.google.com/store/apps/details?id=com.tourisminturkey.livres" target="_blank" rel="noopener noreferrer"><span class="triangle"></span><span>Google Play</span></a>
    </article>
    <article class="card">
      <div class="row"><div class="icon">🎂</div><h2>Age Calculator</h2></div>
      <a class="play" href="https://play.google.com/store/apps/details?id=com.tourisminturkey.agedatecalculator" target="_blank" rel="noopener noreferrer"><span class="triangle"></span><span>Google Play</span></a>
    </article>
    <article class="card">
      <div class="row"><div class="icon">❄️</div><h2>Winter Wallpaper</h2></div>
      <a class="play" href="https://play.google.com/store/apps/details?id=com.tourisminturkey.holidayschristmaswallpaper" target="_blank" rel="noopener noreferrer"><span class="triangle"></span><span>Google Play</span></a>
    </article>
  </section>
  <div class="footer">Android • Google Play</div>
</main>
</body>
</html>
